<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Estoque — Acesso</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="inventario.css">
</head>
<body class="login-body">

  <div class="login-container">
    <div class="login-logo">ESTOQUE <span>●</span></div>
    <p class="login-subtitle">Selecione sua unidade</p>

    <div class="login-units">
      <button class="login-unit-btn" onclick="selectUnit('batel')">Batel</button>
      <button class="login-unit-btn" onclick="selectUnit('maringa')">Maringá</button>
      <button class="login-unit-btn" onclick="selectUnit('parkshopping')">Park Shopping</button>
      <button class="login-unit-btn" onclick="selectUnit('bigorrilho')">Bigorrilho</button>
      <button class="login-unit-btn" onclick="selectUnit('cascavel')">Cascavel</button>
      <button class="login-unit-btn" onclick="selectUnit('cozinhacentral')" style="grid-column:1/-1;background:#6d28d9;color:#fff;border-color:#6d28d9;">🏭 Cozinha Central</button>
    </div>

    <button class="login-resumo-btn" onclick="selectUnit('global')">📊 Painel Geral — Dono</button>
  </div>

  <!-- PIN Modal -->
  <div class="inv-overlay" id="pinOverlay">
    <div class="inv-modal">
      <h2 id="pinTitle">Acesso Admin</h2>
      <p id="pinSubtitle">Digite o PIN para entrar como admin</p>
      <input class="inv-pin-input" id="pinInput" type="password"
             inputmode="numeric" maxlength="4" autocomplete="off"
             onkeydown="if(event.key==='Enter')doLogin()">
      <button class="inv-modal-btn" onclick="doLogin()">Entrar como Admin</button>
      <button class="inv-modal-cancel" id="skipBtn" onclick="goEmployee()">Entrar sem PIN (só contagem)</button>
      <button class="inv-modal-cancel" onclick="cancelLogin()" style="color:#bbb;margin-top:4px">↩ Voltar</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://nhuotdwfzowydrjeyttc.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5odW90ZHdmem93eWRyamV5dHRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MTM2NDAsImV4cCI6MjA5NTk4OTY0MH0.JovSWvkJ5OdX1tauz7sYOuyDIm1Mbcx5gJF8Zb20oe4';

    // PINs reais ficam no Supabase (config_pins). Estes são fallback offline.
    let UNIT_ADMINS = {
      global:         [{ nome: 'Kauê', pin: '2009' }],
      batel:          [{ nome: 'Admin', pin: '0808' }],
      maringa:        [{ nome: 'Admin', pin: '0969' }],
      parkshopping:   [{ nome: 'Admin', pin: '5292' }],
      bigorrilho:     [{ nome: 'Admin', pin: '5292' }],
      cascavel:       [{ nome: 'Admin', pin: '1111' }],
      cozinhacentral: [{ nome: 'Admin', pin: '2121' }],
    };
    const UNIT_LABELS = {
      batel: 'Batel', maringa: 'Maringá', parkshopping: 'Park Shopping',
      bigorrilho: 'Bigorrilho', cascavel: 'Cascavel', cozinhacentral: 'Cozinha Central', global: 'Painel Geral'
    };

    // PIN LOJA — acesso restrito (Contagem + Etiquetas + Checklist). Teste isolado: só Batel.
    let UNIT_LOJA = {
      batel: [{ nome: 'Loja', pin: '5050' }],
    };

    // Busca PINs reais do Supabase (mesma lógica do inventario.js)
    (async () => {
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/inventario_dados?chave=eq.config_pins&select=estado`,
          { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
        );
        const rows = await res.json();
        if (rows?.[0]?.estado) Object.assign(UNIT_ADMINS, rows[0].estado);
      } catch(e) {}
    })();

    let selectedUnit = null;

    function selectUnit(unit) {
      selectedUnit = unit;
      document.getElementById('pinTitle').textContent = UNIT_LABELS[unit] || unit;
      document.getElementById('pinSubtitle').textContent = 'Digite o PIN para entrar como admin';
      document.getElementById('pinInput').value = '';
      document.getElementById('pinInput').classList.remove('error');
      document.getElementById('skipBtn').style.display = unit === 'global' ? 'none' : 'block';
      document.getElementById('pinOverlay').classList.add('open');
      setTimeout(() => document.getElementById('pinInput').focus(), 100);
    }

    function doLogin() {
      const pin    = document.getElementById('pinInput').value;
      const admins = [...(UNIT_ADMINS[selectedUnit] || []), ...(selectedUnit !== 'global' ? (UNIT_ADMINS.global || []) : [])];
      const admin  = admins.find(a => a.pin === pin);

      const lojaList = UNIT_LOJA[selectedUnit] || [];
      const loja = !admin && lojaList.find(a => a.pin === pin);
      if (loja) {
        sessionStorage.setItem('inv_session', JSON.stringify({
          nome: loja.nome, unidade: selectedUnit, isAdmin: false, isLoja: true, isGlobal: false
        }));
        window.location.href = 'inventario.html?u=' + selectedUnit;
        return;
      }

      if (admin) {
        const isGlobal = selectedUnit === 'global';
        sessionStorage.setItem('inv_session', JSON.stringify({
          nome:    admin.nome,
          unidade: isGlobal ? null : selectedUnit,
          isAdmin: true,
          isGlobal
        }));
        window.location.href = isGlobal ? 'resumo.html' : 'inventario.html?u=' + selectedUnit;
      } else {
        const inp = document.getElementById('pinInput');
        inp.classList.add('error');
        inp.value = '';
        setTimeout(() => inp.classList.remove('error'), 400);
      }
    }

    function goEmployee() {
      sessionStorage.removeItem('inv_session');
      window.location.href = 'inventario.html?u=' + selectedUnit;
    }

    function cancelLogin() {
      document.getElementById('pinOverlay').classList.remove('open');
      selectedUnit = null;
    }
  </script>
</body>
</html>
