<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Franqueadora — Controles All</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="inventario.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f1f5f9; font-family: 'Inter', sans-serif; }

    /* ── Header ── */
    .r-header {
      background: #1e293b; color: #fff;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px;
      position: sticky; top: 0; z-index: 10;
    }
    .r-logo { font-size: 14px; font-weight: 700; letter-spacing: .8px; }
    .r-logo span { color: #4ade80; }
    .r-logout { background: rgba(255,255,255,.12); border: none; color: #fff;
      font-size: 13px; padding: 5px 12px; border-radius: 6px; cursor: pointer; }

    /* ── Main ── */
    .r-main { padding: 14px 12px 32px; max-width: 900px; margin: 0 auto; }

    /* ── Título de seção ── */
    .r-section { font-size: 10px; font-weight: 700; color: #94a3b8;
      text-transform: uppercase; letter-spacing: .7px; margin: 16px 0 8px; }

    /* ── Card resumo geral (topo) ── */
    .r-summary {
      background: #1e293b; border-radius: 14px; padding: 16px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      margin-bottom: 6px;
    }
    .r-sum-block { background: rgba(255,255,255,.07); border-radius: 10px; padding: 12px 14px; }
    .r-sum-title { font-size: 10px; font-weight: 700; color: #94a3b8;
      text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px; }
    .r-sum-big { font-size: 26px; font-weight: 800; line-height: 1; }
    .r-sum-sub { font-size: 11px; color: #94a3b8; margin-top: 4px; }
    .r-sum-row { display: flex; gap: 10px; margin-top: 8px; }
    .r-sum-item { flex: 1; }
    .r-sum-item-label { font-size: 9px; color: #64748b; text-transform: uppercase; font-weight: 600; }
    .r-sum-item-val   { font-size: 13px; font-weight: 700; color: #e2e8f0; }

    /* ── Card de unidade ── */
    .r-unit-card {
      background: #fff; border-radius: 14px;
      border: 1px solid #e2e8f0; margin-bottom: 10px; overflow: hidden;
    }
    .r-unit-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px 10px; border-bottom: 1px solid #f1f5f9;
    }
    .r-unit-nome { font-size: 15px; font-weight: 700; color: #1e293b; }
    .r-unit-link { font-size: 12px; color: #3b82f6; font-weight: 600; text-decoration: none; }

    /* ── CMV Mensal destaque ── */
    .r-monthly {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: #f8fafc; border-bottom: 1px solid #f1f5f9;
    }
    .r-monthly-left { }
    .r-monthly-label { font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; }
    .r-monthly-sub   { font-size: 10px; color: #94a3b8; margin-top: 1px; }
    .r-monthly-nums  { display: flex; align-items: baseline; gap: 8px; }
    .r-monthly-real  { font-size: 22px; font-weight: 800; }
    .r-monthly-meta  { font-size: 12px; color: #94a3b8; }

    /* ── Semanas ── */
    .r-weeks { padding: 10px 14px 14px; }
    .r-weeks-title { font-size: 10px; font-weight: 700; color: #64748b;
      text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
    .r-week-table { width: 100%; border-collapse: collapse; }
    .r-week-table th {
      font-size: 9px; font-weight: 700; color: #94a3b8; text-transform: uppercase;
      letter-spacing: .5px; text-align: right; padding: 0 6px 6px; white-space: nowrap;
    }
    .r-week-table th:first-child { text-align: left; padding-left: 0; }
    .r-week-table td {
      font-size: 12px; color: #475569; text-align: right; padding: 5px 6px;
      border-top: 1px solid #f1f5f9; white-space: nowrap;
    }
    .r-week-table td:first-child { text-align: left; padding-left: 0; font-weight: 600; color: #334155; font-size: 11px; }
    .r-week-table td strong { font-weight: 700; color: #1e293b; }
    .r-week-table td .saldo-pos { color: #16a34a; font-weight: 700; }
    .r-week-table td .saldo-neg { color: #dc2626; font-weight: 700; }
    .r-week-empty { font-size: 11px; color: #cbd5e1; font-style: italic; }
    .r-week-bar-bg { height: 4px; background: #e2e8f0; border-radius: 2px; overflow: hidden; margin-top: 3px; }
    .r-week-bar-fill { height: 100%; border-radius: 2px; transition: width .4s; }


    /* ── Datas ── */
    .r-dates {
      display: flex; gap: 6px;
      padding: 8px 14px 12px; border-top: 1px solid #f1f5f9;
    }
    .r-date-chip { flex: 1; background: #f8fafc; border-radius: 8px; padding: 6px 8px; }
    .r-date-chip.alert { background: #fef2f2; }
    .r-date-chip.good  { background: #f0fdf4; }
    .r-date-label { font-size: 9px; font-weight: 700; color: #64748b; text-transform: uppercase; }
    .r-date-val   { font-size: 12px; font-weight: 700; color: #1e293b; margin-top: 2px; }
    .r-date-val.old { color: #ef4444; }
    .r-date-val.ok  { color: #16a34a; }
    .r-date-sub   { font-size: 9px; color: #94a3b8; }

    /* ── Sem dados ── */
    .r-no-data { padding: 12px 14px; color: #94a3b8; font-size: 12px; }

    @media (max-width: 480px) {
      .r-summary { grid-template-columns: 1fr; }
      .r-week-stats { gap: 6px; }
    }
  </style>
</head>
<body>

  <div class="r-header">
    <div class="r-logo">CONTROLES <span>●</span> ALL &nbsp;·&nbsp; Franqueadora</div>
    <button class="r-logout" onclick="logout()">Sair</button>
  </div>

  <main class="r-main">
    <div id="unitsBlock">
      <p style="color:#94a3b8;text-align:center;padding:32px 0">Carregando...</p>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://nhuotdwfzowydrjeyttc.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5odW90ZHdmem93eWRyamV5dHRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MTM2NDAsImV4cCI6MjA5NTk4OTY0MH0.JovSWvkJ5OdX1tauz7sYOuyDIm1Mbcx5gJF8Zb20oe4';
    const UNITS       = ['batel','maringa','parkshopping','bigorrilho','cascavel'];
    const UNIT_LABELS = { batel:'Batel', maringa:'Maringá', parkshopping:'Park Shopping', bigorrilho:'Bigorrilho', cascavel:'Cascavel' };

    let session = null;
    try { session = JSON.parse(sessionStorage.getItem('inv_session') || 'null'); } catch(e) {}
    if (!session || !session.isGlobal) { window.location.href = 'index.html'; }

    function logout() { sessionStorage.removeItem('inv_session'); window.location.href = 'index.html'; }

    /* ── Helpers ── */
    function fmtR(n) {
      if (n == null || isNaN(n)) return '—';
      return 'R$ ' + Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }
    function fmtDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      if (isNaN(d)) return '—';
      return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' });
    }
    function daysSince(iso) {
      if (!iso) return null;
      return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
    }
    function cmvColor(real, meta) {
      if (real == null) return '#94a3b8';
      const r = real / (meta || 30);
      return r >= 1 ? '#ef4444' : r >= 0.85 ? '#f59e0b' : '#22c55e';
    }

    /* ── Helpers de data ── */
    function parseDDMMYYYY(s) {
      if (!s) return null;
      // DD/MM/YYYY
      const m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if (m) return new Date(+m[3], +m[2]-1, +m[1]);
      return new Date(s);
    }
    function getWeekMonday(weekKey) {
      if (!weekKey || !weekKey.includes('-W')) return new Date();
      const [yr, wStr] = weekKey.split('-W');
      const week = parseInt(wStr);
      const jan4 = new Date(+yr, 0, 4);
      const jan4Day = jan4.getDay() || 7;
      const week1Mon = new Date(jan4 - (jan4Day - 1) * 86400000);
      return new Date(week1Mon.getTime() + (week - 1) * 7 * 86400000);
    }
    function getWeekLabel(weekKey) {
      if (!weekKey || !weekKey.includes('-W')) return weekKey || '—';
      const mon = getWeekMonday(weekKey);
      const sun = new Date(mon.getTime() + 6 * 86400000);
      const f = d => d.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' }).replace('.', '');
      const wNum = parseInt(weekKey.split('-W')[1]);
      return `Sem. ${wNum} · ${f(mon)} – ${f(sun)}`;
    }

    /* ── Chave ISO de uma data ── */
    function getWeekKey(date) {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const day = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - day);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
      return `${d.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
    }

    /* ── Últimas 4 semanas do calendário (mais antiga → mais recente) ── */
    function last4Weeks() {
      const keys = [];
      const today = new Date();
      for (let i = 3; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(d.getDate() - i * 7);
        keys.push(getWeekKey(d));
      }
      return keys;
    }

    /* ── Calcula métricas por unidade ── */
    function calcUnit(data) {
      const cmv = data?.cmv || {};

      // Sempre mostra as últimas 4 semanas do calendário, com ou sem dados
      const weeks = last4Weeks().map(key => {
        const d     = cmv[key] || {};
        const fat   = d.faturamento || 0;
        const meta  = d.meta_pct || 30;
        const notas = d.notas || [];
        const gasto = notas.reduce((s, n) => s + (n.valor || 0), 0);
        const real  = fat > 0 ? (gasto / fat) * 100 : null;
        const prog  = fat > 0 ? Math.min(gasto / (fat * meta / 100) * 100, 100) : 0;
        return { key, label: getWeekLabel(key), fat, meta, gasto, real, prog, notas };
      });

      // Última NF — usa n.ts (momento do lançamento no app), não a data da nota
      let lastNFts = 0;
      for (const wk of weeks) {
        for (const n of wk.notas) {
          if ((n.ts || 0) > lastNFts) lastNFts = n.ts;
        }
      }

      // Maiores linhas de gasto das últimas 4 semanas
      const linhaMap = {};
      for (const wk of weeks) {
        for (const n of wk.notas) {
          if (n.linhas?.length) {
            n.linhas.forEach(l => {
              const k = l.linha || 'Outros';
              linhaMap[k] = (linhaMap[k] || 0) + (l.valor || 0);
            });
          } else {
            const k = n.linha || 'Outros';
            linhaMap[k] = (linhaMap[k] || 0) + (n.valor || 0);
          }
        }
      }
      const topLinhas = Object.entries(linhaMap).sort((a, b) => b[1] - a[1]).slice(0, 5);

      return { weeks, lastNFts, lastCount: data?.lastCountDate || null, topLinhas };
    }

    /* ── Card de unidade ── */
    function unitCard(unit, data) {
      const label = UNIT_LABELS[unit];
      const m     = calcUnit(data);

      const nfDays    = m.lastNFts > 0 ? Math.floor((Date.now() - m.lastNFts) / 86400000) : null;
      const nfDisplay = m.lastNFts > 0 ? new Date(m.lastNFts).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) : null;
      const cntDays   = daysSince(m.lastCount);
      const nfChip  = nfDays  == null ? '' : nfDays  > 7  ? 'alert' : 'good';
      const cntChip = cntDays == null ? '' : cntDays > 10 ? 'alert' : 'good';
      const nfCls   = nfDays  == null ? '' : nfDays  > 7  ? 'old'   : 'ok';
      const cntCls  = cntDays == null ? '' : cntDays > 10 ? 'old'   : 'ok';

      const weeksHtml = `
        <table class="r-week-table">
          <thead><tr>
            <th>Semana</th>
            <th>Faturamento</th>
            <th>Gasto</th>
            <th>Saldo</th>
            <th>CMV</th>
          </tr></thead>
          <tbody>
          ${m.weeks.map(wk => {
            if (wk.fat === 0 && wk.gasto === 0) return `
              <tr>
                <td>${wk.label}</td>
                <td colspan="4" style="color:#cbd5e1;font-style:italic;font-size:11px">sem lançamentos</td>
              </tr>`;
            const saldo = wk.fat - wk.gasto;
            const saldoCls = saldo >= 0 ? 'saldo-pos' : 'saldo-neg';
            const col = cmvColor(wk.real, wk.meta);
            const cmvTxt = wk.real != null
              ? `<strong style="color:${col}">${wk.real.toFixed(1)}%</strong>`
              : `<span style="color:#cbd5e1">—</span>`;
            return `
              <tr>
                <td>${wk.label}</td>
                <td><strong>${fmtR(wk.fat) !== '—' ? fmtR(wk.fat) : '<span style="color:#cbd5e1">—</span>'}</strong></td>
                <td><strong>${fmtR(wk.gasto)}</strong></td>
                <td><span class="${wk.fat > 0 ? saldoCls : ''}">${wk.fat > 0 ? fmtR(saldo) : '—'}</span></td>
                <td>${cmvTxt}</td>
              </tr>
              <tr><td colspan="5" style="padding:0 0 2px"><div class="r-week-bar-bg"><div class="r-week-bar-fill" style="width:${wk.prog.toFixed(1)}%;background:${col}"></div></div></td></tr>`;
          }).join('')}
          </tbody>
        </table>`;

      const linhasHtml = m.topLinhas.length > 0 ? `
        <div style="padding:8px 14px 12px;border-top:1px solid #f1f5f9">
          <div style="font-size:9px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Maiores gastos · últimas 4 sem.</div>
          ${m.topLinhas.map(([l, v]) => `
            <div style="display:flex;justify-content:space-between;padding:2px 0">
              <span style="font-size:12px;color:#475569">${l}</span>
              <span style="font-size:12px;font-weight:700;color:#1e293b">${fmtR(v)}</span>
            </div>`).join('')}
        </div>` : '';

      return `
        <div class="r-unit-card">
          <div class="r-unit-head">
            <span class="r-unit-nome">${label}</span>
            <a class="r-unit-link" href="inventario.html?u=${unit}">Abrir →</a>
          </div>
          <div class="r-dates">
            <div class="r-date-chip ${nfChip}">
              <div class="r-date-label">Última NF</div>
              <div class="r-date-val ${nfCls}">${nfDisplay || '—'}</div>
              <div class="r-date-sub">${nfDays != null ? nfDays + ' dias atrás' : 'sem registro'}</div>
            </div>
            <div class="r-date-chip ${cntChip}">
              <div class="r-date-label">Última Contagem</div>
              <div class="r-date-val ${cntCls}">${m.lastCount ? fmtDate(m.lastCount) : '—'}</div>
              <div class="r-date-sub">${cntDays != null ? cntDays + ' dias atrás' : 'sem registro'}</div>
            </div>
          </div>
          <div class="r-weeks">
            <div class="r-weeks-title">Últimas 4 semanas</div>
            ${weeksHtml}
          </div>
          ${linhasHtml}
        </div>`;
    }

    /* ── Render ── */
    async function loadUnit(unit) {
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/inventario_dados?chave=eq.dados_${unit}&select=estado`,
          { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
        );
        const rows = await res.json();
        return rows.length ? rows[0].estado : null;
      } catch(e) { return null; }
    }

    async function render() {
      const allData = await Promise.all(UNITS.map(u => loadUnit(u).then(d => ({ unit: u, data: d }))));
      document.getElementById('unitsBlock').innerHTML = allData.map(({ unit, data }) => unitCard(unit, data)).join('');
    }

    document.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
