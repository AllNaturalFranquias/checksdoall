name: Boletos Semanal

on:
  schedule:
    # Toda segunda-feira às 08:15 BRT = 11:15 UTC (logo após o relatório CMV)
    - cron: '15 11 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Teste sem enviar email (true/false)'
        default: 'false'

jobs:
  enviar-boletos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install nodemailer

      - name: Enviar lista de boletos da semana
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          GESTOR_EMAIL: ${{ secrets.GESTOR_EMAIL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/boletos.mjs
